services:
  - type: web
    name: sgtc-command-center
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Evita que el plan gratis se duerma tras 15 min sin uso (ping interno cada 10 min)
      - key: KEEP_ALIVE
        value: "true"
      - key: APP_TIMEZONE
        value: America/Panama
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: API_TOKEN
        sync: false
